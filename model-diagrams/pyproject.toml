[project]
name = "modeldiagram"
version = "0.1.0"
description = "Writes a model's structure and real values in the vault's model-diagram format"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "transformers>=5.20", "pyyaml", "pillow", "safetensors"]

[project.scripts]
modeldiagram = "modeldiagram.cli:main"

[tool.setuptools]
packages = ["modeldiagram"]

[tool.pytest.ini_options]
markers = ["slow: builds Qwen3.5-9B on the meta device"]
